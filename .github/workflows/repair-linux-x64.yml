name: "Repair Linux x64 release"

on:
  workflow_dispatch:
    inputs:
      release-id:
        description: "Existing draft GitHub release ID"
        required: true
        type: string

jobs:
  build-linux-x64:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "ubuntu-24.04"
      target: "x86_64-unknown-linux-gnu"
      build-args: "--bundles appimage,rpm"
      sign-binaries: false
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ inputs.release-id }}
      no-cache: true
    secrets: inherit
